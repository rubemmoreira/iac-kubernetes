name: CI/CD Pipeline

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'helm-charts/**'

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/todo-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Update Helm values
        run: |
          sed -i 's|tag:.*|tag: ${{ env.DOCKER_TAG }}|' helm-charts/todo-app/values.yaml
          sed -i 's|repository:.*|repository: ${{ env.DOCKER_IMAGE }}|' helm-charts/todo-app/values.yaml

      - name: Commit and push Helm changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-charts/todo-app/values.yaml
          git commit -m "Update image tag to ${{ env.DOCKER_TAG }}" || echo "No changes"
          git push